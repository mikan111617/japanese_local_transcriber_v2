name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -c "from faster_whisper import WhisperModel; import ctranslate2; print(ctranslate2.__version__)"
      - run: python -m compileall -q app.py gpu_runtime.py transcription.py outputs.py
      - run: python -m unittest discover -s tests -v
      - name: GUI smoke tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -p 'gui_smoke.py' -v
      - name: GUI smoke tests (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p 'gui_smoke.py' -v
